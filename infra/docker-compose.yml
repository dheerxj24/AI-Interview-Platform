# Run from this folder: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  # Builds the sandbox image that the worker uses for every submission.
  sandbox:
    build: ../sandbox
    image: interview-sandbox:latest
    command: ["python", "-c", "pass"]
    restart: "no"

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN before running docker compose}
      REALTIME_BACKEND: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: ../backend
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      EXECUTOR: docker
      CELERY_EAGER: "false"
    # The worker starts sandbox containers, so it needs the Docker socket.
    # Anyone with access to this socket can control the host. Use a separate
    # host or rootless Docker for anything beyond local demos.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sandbox:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
